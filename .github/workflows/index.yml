name: Index

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  # Keyed on the *publish*, not on the branch: two runs writing one release is
  # a release written by two runs, whichever refs they came from.
  group: ${{ github.workflow }}-${{ github.ref == 'refs/heads/main' && 'publish' || github.ref }}
  # A pull request's last push is the only one anybody reads. A publish is
  # not: cancelling one half way through leaves a release whose files were
  # written by two different runs.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # This job runs *strangers' code*. Every plugin it builds brings its own
    # `build.rs` and its own proc macros, and both run on this machine with
    # whatever is on it — so what is on it is: no token that can write
    # anything, and no checkout credentials left behind in `.git/config` for
    # one of them to find. What it produces is an artifact, and the job below
    # is the only thing that can publish one.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          # The default is to leave the job's token in `.git/config`, where a
          # build script could read it. Nothing here pushes.
          persist-credentials: false
          # Enough history to see what a pull request changed.
          fetch-depth: 0

      # The wasm target for the default toolchain. Each plugin's own
      # `rust-toolchain.toml` may name another one, and `tools/index.py` adds
      # the target again inside each checkout for exactly that reason.
      - name: Rust
        run: |
          rustup show
          rustup target add wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2

      # Crook's own reader, so that what the index says a plugin is, is what
      # the terminal will decide it is. The version is the plugin ABI it
      # reads: `0.8` reads ABI 8.
      - name: Install crook-plugin-info
        run: cargo install crook_wasm --version '^0.8' --locked

      # A pull request builds what it changed and nothing else. Forty-five
      # minutes to review a line of README is forty-five minutes nobody spends
      # twice, and `--only` deliberately writes no index: one plugin is a
      # build, and publishing it as a list would take every other plugin off
      # that list.
      - name: Build what this pull request changed
        if: github.event_name == 'pull_request'
        run: |
          set -eu
          # `git diff` failing — a base ref that was not fetched — must not
          # read as "nothing changed", which is a green tick on a build that
          # never happened.
          base="origin/${{ github.base_ref }}"
          git rev-parse --verify --quiet "$base" > /dev/null \
            || { echo "::error::$base is not here, so what this changed cannot be worked out"; exit 1; }
          changed=$(git diff --name-only "$base...HEAD" \
            | sed -n 's|^plugins/\([^/]*\)/.*|\1|p' | sort -u)
          if [ -z "$changed" ]; then
            echo "no plugin entry changed; nothing to build"
            exit 0
          fi
          for folder in $changed; do
            # A directory that was *removed* has nothing to build and is not a
            # failure: the entry is gone, and what that means for the index is
            # the publish job's business on main.
            if [ ! -f "plugins/$folder/plugin.toml" ]; then
              echo "plugins/$folder is gone; nothing to build for it"
              continue
            fi
            id=$(python3 -c "
          import sys, tomllib
          print(tomllib.load(open('plugins/$folder/plugin.toml','rb'))['id'])")
            echo "::group::$id"
            tools/index.py --out build --only "$id"
            echo "::endgroup::"
          done

      # What is out there already. A version anybody could have installed keeps
      # the artifact and the hash it went out with — two builds of one commit
      # on different toolchain patch versions produce different modules, so a
      # rebuild is a new artifact under an old version's name, not the same
      # thing again. Missing, unreadable or a 404 means the registry has
      # published nothing yet and everything is built.
      - name: What is already published
        if: github.event_name != 'pull_request'
        run: |
          url="https://github.com/$GITHUB_REPOSITORY/releases/download/index/index.json"
          code=$(curl --silent --location --output published.json --write-out '%{http_code}' "$url")
          case "$code" in
            200)
              # Refuse an index that is not one *here*, rather than carrying
              # nothing over and rebuilding everything as if the registry had
              # published nothing.
              python3 -c "import json,sys; json.load(open('published.json'))"
              echo "carrying over what is in the published index"
              ;;
            404)
              # The registry has published nothing yet, which is true exactly
              # once and is the only reason to build everything.
              rm -f published.json
              echo "nothing published yet"
              ;;
            *)
              # Anything else is the network, and failing *open* here would
              # rebuild every published version and clobber the release with
              # artifacts that hash differently. A run that cannot read the
              # index does not get to replace it.
              echo "::error::the published index answered $code; refusing to rebuild what is out there"
              exit 1
              ;;
          esac

      - name: Build what is new and write the index
        if: github.event_name != 'pull_request'
        run: |
          tools/index.py --out build --keep published.json \
            --base-url "https://github.com/$GITHUB_REPOSITORY/releases/download/index"

      # What the publish job will upload, and what a reviewer can look at
      # before it is uploaded anywhere.
      - uses: actions/upload-artifact@v4
        if: github.event_name != 'pull_request'
        with:
          name: index
          path: build/
          retention-days: 7

  publish:
    name: Publish
    needs: build
    # Main and nothing else. `workflow_dispatch` can be pointed at any branch,
    # and the index it would write from one is the list every Crook reads.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # The only job with a token that can write, and the only one that runs no
    # code it did not bring: it downloads what `build` made and uploads it.
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: index
          path: build

      # One release, rewritten in place, and the tag never moves: `index` is
      # the URL every Crook reads, so it is the one thing here that has to be
      # stable forever. A release rather than Pages because a registry should
      # be a repository with a workflow in it and nothing else configured —
      # somebody forking this to run their own list changes one line in their
      # Crook, not a site setting.
      #
      # The artifacts go up *before* the index, and that order is the whole of
      # what keeps a half-finished publish safe: the list is the last thing to
      # change, so it never names a file that is not there yet.
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view index --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 \
            || gh release create index --repo "$GITHUB_REPOSITORY" \
                 --title "The current index" \
                 --notes "The list every Crook reads, and the artifacts it names."
          # Nothing to upload when every version was carried over, which is
          # the ordinary run: the artifacts are already up there untouched,
          # and the index below may still have changed — a withdrawal is a
          # line in the list and not a new module.
          if ls build/artifacts/*.wasm >/dev/null 2>&1; then
            gh release upload index build/artifacts/*.wasm \
              --repo "$GITHUB_REPOSITORY" --clobber
          fi
          gh release upload index build/index.json \
            --repo "$GITHUB_REPOSITORY" --clobber
